name: Update VPN subscriptions

# Запуск:
#   * вручную:      Actions → Update VPN subscriptions → Run workflow
#   * по расписанию: каждые 6 часов
#   * при изменении кода/конфига (push в main)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "sources.yaml"
      - "src/**"
      - ".github/workflows/update.yml"

concurrency:
  group: meeyota-subscriptions
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  SINGBOX_VERSION: "1.14.0"

jobs:
  build:
    name: Aggregate, check, commit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install sing-box (для проверок VPN Wi-fi)
        run: |
          curl -fsSL -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64-glibc.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /usr/local/bin sing-box
          sing-box version

      - name: Run aggregator (collect → parse → dedup → checks → export)
        run: python -m src.main --checks --workers 10 --check-minutes 110 --verbose
        env:
          SINGBOX_BIN: /usr/local/bin/sing-box

      - name: Commit changes (только если файлы изменились)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ \
                  data/configs.json \
                  data/check_results.json \
                  data/geo_cache.json \
                  data/stats.json \
                  data/incy-links.txt \
                  README.md
          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit"
          else
            git commit -m "chore: update meeyota subscriptions ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi

      - name: Upload GitHub Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
