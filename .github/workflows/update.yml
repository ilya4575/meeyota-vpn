name: Update meeyota subscriptions

# Запуск: вручную (workflow_dispatch) и автоматически по расписанию.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"   # каждые 4 часа
  # бонус: при изменении источников (не влияет на расписание/ручной запуск)
  push:
    branches: [main]
    paths:
      - "sources.yaml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: meeyota-update
  cancel-in-progress: false   # не обрываем запущенный цикл (долгие проверки)

jobs:
  test:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -q

  build:
    name: Collect → check → export
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run aggregator
        env:
          MAX_CHECKS: ${{ vars.MAX_CHECKS || '400' }}
          WORKERS: ${{ vars.WORKERS || '5' }}
          CHECK_TTL_HOURS: ${{ vars.CHECK_TTL_HOURS || '24' }}
        run: |
          python -m src.main \
            --sources sources.yaml \
            --data-dir data \
            --output-dir output \
            --readme README.md \
            --max-checks "${MAX_CHECKS}" \
            --workers "${WORKERS}" \
            --check-ttl-hours "${CHECK_TTL_HOURS}"

      - name: Commit changes (only if changed)
        run: |
          git config user.name "meeyota-bot"
          git config user.email "meeyota-bot@users.noreply.github.com"
          git add -A output data README.md
          if git diff --cached --quiet; then
            echo "::notice::output/ и data/ не изменились — коммит не нужен."
          else
            git commit -m "chore: update subscriptions $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

  publish:
    name: Publish to GitHub Pages
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (каталог output/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
