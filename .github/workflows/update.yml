name: update

on:
  schedule:
    # каждые 6 часов
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          PAGES_USERNAME: ${{ github.repository_owner }}
          PAGES_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          python -m src.main

      - name: Validate emitted profiles (structural)
        run: |
          python tests/test_incy_import.py
          python tests/test_scale.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit stats (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json || true
          if git diff --cached --quiet; then
            echo "No stats changes"
          else
            git commit -m "chore: update stats [skip ci]"
            git push || echo "Push failed (probably no permission)"
          fi
