# ============================================================================
# meeyota-vpn — конфигурация источников
#
# Декларативный список источников. Код менять не нужно — добавляйте/убирайте
# записи в списке `sources`.
#
# Поддерживаемые типы:
#   type: github — GitHub-репозиторий (repo + branch + files)
#   type: url    — произвольный HTTPS-URL
#
# Путь к файлу в `github`-источнике — относительно корня репозитория.
# ============================================================================

version: 1

settings:
  timeout: 30
  retries: 3
  backoff: 2.0
  max_file_size_mb: 25
  use_api_fallback: true
  cache_dir: data/cache

pages:
  username: ilya4575
  repository: meeyota-vpn

safety:
  min_configs_whitelist: 50
  min_configs_wifi: 5
  max_drop_ratio: 0.5
  max_outbounds_whitelist: 3000
  max_outbounds_wifi: 500

checks:
  workers: 10
  per_check_timeout: 12
  check_url: "http://www.google.com/generate_204"
  ttl_days: 3
  results_max_configs: 20000
  geo_primary: "ipwho.is"
  geo_fallback: "ip-api.com"

update_interval_hours: 6

sources:
  # --------------------------------------------------------------------
  # 1. FLAT447/v2ray-lists — корневые TXT-подписки
  #    Содержат vless, ss, trojan, hysteria2
  # --------------------------------------------------------------------
  - id: flat447-v2ray-lists
    name: "FLAT447/v2ray-lists"
    type: github
    repo: FLAT447/v2ray-lists
    branch: main
    files:
      - WHITE_FULL.txt
      - BLACK_FULL.txt

  # --------------------------------------------------------------------
  # 2. hiztin/VLESS-PO-GRIBI — VLESS Reality подписки по источникам
  # --------------------------------------------------------------------
  - id: hiztin-vless-po-gribi
    name: "hiztin/VLESS-PO-GRIBI"
    type: github
    repo: hiztin/VLESS-PO-GRIBI
    branch: main
    files:
      - deploy/subscriptions/1.txt

  # --------------------------------------------------------------------
  # 3. AvenCores/goida-vpn-configs — githubmirror/*.txt
  #    Используем как технический склад URI; не передаём RU-тематику в наши подписки
  # --------------------------------------------------------------------
  - id: goida-vpn-configs
    name: "AvenCores/goida-vpn-configs"
    type: github
    repo: AvenCores/goida-vpn-configs
    branch: main
    files:
      - githubmirror/1.txt
      - githubmirror/7.txt
