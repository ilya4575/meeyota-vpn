# ============================================================================
# meeyota-vpn — источники подписок
# ============================================================================
# Добавление нового источника — БЕЗ изменения Python-кода:
#
#   - id:       уникальный идентификатор (латиницей, без пробелов)
#   - name:     человекочитаемое имя (попадёт в data/configs.json)
#   - url:      прямой URL файла (raw.githubusercontent.com / любая ссылка)
#   - enabled:  true/false — временное отключение без удаления
#   - timeout / retries / retry_delay / max_bytes — опционально, переопределяют defaults
#   - note:     комментарий (откуда источник)
#
# Форматы файлов: текст с URI по одному на строку; целое содержимое в base64;
# строки, начинающиеся с '#', — комментарии (пропускаются).
# Пути ниже проверены по актуальной структуре репозиториев (2026-09-12).
# ============================================================================

defaults:
  timeout: 30
  retries: 3
  retry_delay: 5
  max_bytes: 25000000        # 25 МБ — защита от гигантских файлов
  user_agent: "meeyota-vpn-aggregator/1.0 (github)"
  cache_ttl_days: 14         # срок жизни кэша источника при сбое live-fetch

sources:

  # ── FLAT447/v2ray-lists (ветка main) ──────────────────────────────────────
  - id: flat447-white-full
    name: FLAT447/v2ray-lists · WHITE_FULL
    url: https://raw.githubusercontent.com/FLAT447/v2ray-lists/main/WHITE_FULL.txt
    note: «белые списки» — конфигурации, обходящие блокировки по SNI/CIDR

  - id: flat447-black-full
    name: FLAT447/v2ray-lists · BLACK_FULL
    url: https://raw.githubusercontent.com/FLAT447/v2ray-lists/main/BLACK_FULL.txt
    note: смешанный список (vless reality, ss, hy2, ...)

  - id: flat447-base64-white
    name: FLAT447/v2ray-lists · BASE64/WHITE_FULL
    url: https://raw.githubusercontent.com/FLAT447/v2ray-lists/main/BASE64/WHITE_FULL.txt
    note: то же содержимое в base64 (проверка декодера; дубликаты уходят в дедуп)

  - id: flat447-mtproxy
    name: FLAT447/v2ray-lists · MTProxy
    url: https://raw.githubusercontent.com/FLAT447/v2ray-lists/main/blacklist.txt
    note: t.me/proxy (MTProto); в whitelist попадает, в wifi не проверяется

